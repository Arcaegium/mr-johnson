<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Johnson — Playable v0</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <!-- Today's plan: a fixed column of its own, because it is the
       thing you build all day rather than a panel you visit. -->
  <div id="planrail" class="planrail"></div>

  <div class="game-wrap">
    <header>
      <h1>Mr. Johnson</h1>
      <div class="tagline">The hub console — an instrument panel over the mechanics. <a class="navlink" href="inspector.html">&larr; dev inspector</a></div>
      <div id="statline" class="statline">No game running.</div>
      <div class="controls" style="margin-top:10px">
        <input type="text" id="universe-seed" placeholder="universe seed (blank = fresh entropy)" />
        <button data-act="new-game">New Game</button>
        <button data-act="load-game">Continue (Load)</button>
        <button data-act="save-game">Save</button>
        <button data-act="end-day" style="border-color: var(--accent); color: var(--accent)">Play Day &raquo;</button>
        <button data-act="quick-day" class="sm" title="AUTO-RESOLVE IS SCAFFOLDING, NOT THE GAME — the skip button">quick resolve</button>
        <!-- Only appears once a morning is on file. Runners die on
             jobs, and the player is never shut out of that decision. -->
        <button data-act="rewind-day" class="sm" hidden
                title="Put the day back the way it was this morning — everything today did is discarded, and the dice are fresh if you play it again">&laquo; rewind the day</button>
      </div>
    </header>

    <!-- The log IS the game's feedback channel right now — biggest,
         first, full width (playtest ruling). -->
    <div class="panel" style="margin-bottom:14px"><h2>Log — the street talks</h2><div id="panel-log" class="game-log log-top"></div></div>

    <!-- ONE WINDOW. Frame (monitor) + tabs + widgets (operate).
         Everything below the log used to be three columns of panels
         splayed down the page; it is now tab -> widget -> item, per
         UNDERSTANDING.md §10's three levels of zoom. -->
    <div id="hub" class="hub">
      <div id="tabbar" class="tabbar"></div>
      <div id="tabbody" class="tabbody"></div>
    </div>
  </div>

  <!-- The frame is state you MONITOR, so it does not scroll away with
       the widgets. Pinned to the bottom of the viewport; the day's
       plan opens upward out of it. -->
  <div class="framebar">
    <div id="frame" class="frame"></div>
  </div>

  <!-- Modules, loaded in dependency order (no build step) -->
  <script src="js/core/rng.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/resolve.js"></script>
  <script src="js/core/tempo.js"></script>
  <script src="js/models/runner.js"></script>
  <script src="js/models/site.js"></script>
  <script src="js/models/alert.js"></script>
  <script src="js/models/job.js"></script>
  <script src="js/models/market.js"></script>
  <script src="js/models/armory.js"></script>
  <script src="js/models/economy.js"></script>
  <script src="js/models/combat.js"></script>
  <script src="js/models/lattice.js"></script>
  <script src="js/models/spells.js"></script>
  <script src="js/models/powers.js"></script>
  <script src="js/models/helpers.js"></script>
  <script src="js/models/astral.js"></script>
  <script src="js/models/matrix.js"></script>
  <script src="js/models/street.js"></script>
  <script src="js/models/verbs.js"></script>
  <script src="js/models/lanes.js"></script>
  <script src="js/models/mission-routes.js"></script>
  <script src="js/models/mission-witness.js"></script>
  <script src="js/models/mission-intel.js"></script>
  <script src="js/models/mission.js"></script>
  <script src="js/models/sitelist.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui-text.js"></script>
  <script src="js/mission-popup.js"></script>
  <script src="js/grimoire.js"></script>
  <script src="js/game-ui.js"></script>
</body>
</html>
