<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Johnson — Playable v0</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div class="game-wrap">
    <header>
      <h1>Mr. Johnson</h1>
      <div class="tagline">Playable v0 — the management loop, text-first and deliberately ugly. <a class="navlink" href="index.html">&larr; dev inspector</a></div>
      <div id="statline" class="statline">No game running.</div>
      <div class="controls" style="margin-top:10px">
        <input type="text" id="universe-seed" placeholder="universe seed (blank = fresh entropy)" />
        <button data-act="new-game">New Game</button>
        <button data-act="expand-capacity">Expand Capacity</button>
        <button data-act="end-day" style="border-color: var(--accent); color: var(--accent)">End Day &raquo;</button>
      </div>
    </header>

    <!-- The log IS the game's feedback channel right now — biggest,
         first, full width (playtest ruling). -->
    <div class="panel" style="margin-bottom:14px"><h2>Log — the street talks</h2><div id="panel-log" class="game-log log-top"></div></div>

    <div class="panels">
      <div>
        <div class="panel"><h2>Active Contracts</h2><div id="panel-contracts"></div></div>
        <div class="panel" style="margin-top:14px"><h2>Job Board <button class="sm" data-act="refresh-board">refresh</button></h2><div id="panel-board"></div></div>
      </div>
      <div>
        <div class="panel"><h2>Roster</h2><div id="panel-roster"></div></div>
        <div class="panel" style="margin-top:14px"><h2>Runner Market <button class="sm" data-act="refresh-market">refresh</button></h2><div id="panel-market"></div></div>
      </div>
      <div>
        <div class="panel"><h2>Dispatch — today's queue</h2><div id="panel-dispatch"></div></div>
        <div class="panel" style="margin-top:14px"><h2>Known Sites</h2><div id="panel-sites"></div></div>
      </div>
    </div>
  </div>

  <!-- Modules, loaded in dependency order (no build step) -->
  <script src="js/core/rng.js"></script>
  <script src="js/core/clock.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/resolve.js"></script>
  <script src="js/models/runner.js"></script>
  <script src="js/models/site.js"></script>
  <script src="js/models/alert.js"></script>
  <script src="js/models/job.js"></script>
  <script src="js/models/market.js"></script>
  <script src="js/models/economy.js"></script>
  <script src="js/models/mission.js"></script>
  <script src="js/models/sitelist.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-ui.js"></script>
</body>
</html>
